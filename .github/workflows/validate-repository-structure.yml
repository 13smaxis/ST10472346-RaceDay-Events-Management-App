name: Validate Repository Structure

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder does not exist."
            exit 1
          fi

          echo "docs folder exists."

      - name: Check required documents
          if [ ! -f "docs/race_day_erd.pdf" ]; then
            echo "ERROR: race_day_erd.pdf is missing."
            exit 1
          fi

          echo "All required documents are present."

          if [ ! -f "docs/race_day_api_endpoints.pdf" ]; then
            echo "ERROR: race_day_api_endpoints.pdf is missing."
            exit 1
          fi

                - name: Validate repository structure
        run: |
          echo "Repository structure is valid."
      